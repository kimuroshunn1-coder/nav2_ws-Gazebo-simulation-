# Gazebo「世界座標」でウェイポイントを書くファイル(RVizなしで巡らせる用)
#   x, y   : 世界座標 [m](Gazeboのワールドの原点が基準)
#   yaw_deg: 到着時のロボットの向き [度]。世界の +X 方向 = 0°、+Y 方向 = 90°、-X = 180°、-Y = -90°(左回りが正)
coordinate: world

# スポーン位置(sim.launch.py の -x -y -Y と同じ値にすること。ずれると座標が全部ずれる)
spawn: {x: -5.0, y: -5.0, yaw_deg: 0.0}

# 【例】実際のフィールドに合わせて書き換えること
waypoints:

  - {x: -4.0, y: -9.4, yaw_deg: 270.0}     # スカイブロック
  - {x:  4.4, y: -5.0, yaw_deg: 0.0}      # アースブロック
  - {x:  4.4, y: -6.0, yaw_deg: 0.0}      #アースブロック２
  - {x: -1.2, y: -5.9, yaw_deg: 270.0}     #受け渡し
  - {x:  3.0, y: -6.5, yaw_deg: 180.0}     #layer1 to layer2
  - {x:  4.0, y: -9.4, yaw_deg: 270.0}     #ムスティカピラー
